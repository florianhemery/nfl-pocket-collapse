[project]
name = "nfl-dss"
version = "0.1.0"
description = "Defensive Sync Score: a tracking-data metric for NFL secondaries (Big Data Bowl 2023)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Florian Hemery" }]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.scripts]
dss = "nfl_dss.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.170.8",
    "jsonschema==4.26.0",
    "pandas-stubs==3.0.5.260914",
    "scipy-stubs==1.18.1.1",
    "pip-audit==2.10.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/legacy_dss.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "C90", "N", "PL", "PT", "T20"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "N806"]

[tool.pyright]
include = ["src", "tests"]
ignore = ["tests/legacy_dss.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--cov=nfl_dss",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
